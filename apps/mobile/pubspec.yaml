name: jastipkita
description: "JastipKita — Titip Mudah, Aman, Terpercaya. P2P traveler-shopping marketplace (Penitip & Traveler)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Keep this list short and mainstream. No code generation (no build_runner).
# A few packages use a range that spans two majors: the app only touches API surface that is
# identical in both, and pub then picks the newest release that supports the CI's Flutter.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; "any" lets the SDK choose.
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  shared_preferences: ^2.3.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ">=6.1.0 <8.0.0"
  image_picker: ^1.1.2
  file_picker: ">=8.1.2 <11.0.0"
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/splash/splash-logo-light.png
    - assets/splash/splash-logo-dark.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# dart run flutter_launcher_icons — sources are copies of brand/app-icon + brand/store (see brand/README.md).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/app-icon-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B1E4A"
  adaptive_icon_foreground: "assets/brand/ic_launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/brand/ic_launcher_monochrome.png"
  web:
    generate: true
    image_path: "assets/brand/app-icon-1024.png"
    background_color: "#0B1E4A"
    theme_color: "#0B1E4A"

# dart run flutter_native_splash:create — config from brand/README.md (§ Flutter).
flutter_native_splash:
  color: "#F7F8FB"
  image: assets/splash/splash-logo-light.png
  branding: assets/splash/splash-branding.png
  color_dark: "#070B19"
  image_dark: assets/splash/splash-logo-dark.png
  branding_dark: assets/splash/splash-branding-dark.png
  android_12:
    image: assets/splash/android12-splash-icon.png
    color: "#F7F8FB"
    image_dark: assets/splash/android12-splash-icon-dark.png
    color_dark: "#070B19"
  web: false
