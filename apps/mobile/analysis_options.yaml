include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `flutter gen-l10n` (CI) — analysed indirectly through its importers.
    - lib/l10n/app_localizations*.dart
    - build/**
  errors:
    # `flutter analyze` treats every info as fatal. Deprecations introduced by a Flutter
    # release newer than this code must not break CI; they are tracked in README instead.
    deprecated_member_use: ignore

linter:
  rules:
    # Stricter than flutter_lints — rules the codebase is written against.
    always_declare_return_types: true
    avoid_print: true
    avoid_empty_else: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_single_quotes: true
    prefer_final_fields: true
    use_super_parameters: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    # Const-ness is a performance hint, not correctness; keeping it as a fatal info across a
    # codebase that CI compiles blind costs more than it saves.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
