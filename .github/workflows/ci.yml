# JastipKita — Continuous Integration
# Jobs: changes → core · db (PG 16/17 + provider parity) · api · web · admin · mobile · secrets · dependency-audit
# Pushes to main run every deployable part (mobile only when it changed). PRs and develop run only the jobs whose
# inputs changed (scripts/ci/detect-changes.sh) to stay inside the GitHub Actions minute quota of a private repo.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  FORCE_COLOR: '1'
  # Base URL baked into CI mobile/web builds (never a secret). Real value: repository variable STAGING_API_BASE_URL.
  CI_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://jastipkita-api-staging.example.workers.dev' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.detect.outputs.core }}
      db: ${{ steps.detect.outputs.db }}
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
      admin: ${{ steps.detect.outputs.admin }}
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main-push' || github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/detect-changes.sh

  core:
    name: core (typecheck + tests + tokens)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager" (pnpm 10)
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@jastipkita/core..." --filter "@jastipkita/design-tokens..."
      - run: pnpm --filter @jastipkita/core typecheck
      - run: pnpm --filter @jastipkita/core test
      - name: Design tokens generated files up to date (+ WCAG AA contrast)
        run: pnpm --filter @jastipkita/design-tokens check

  db:
    name: db (PostgreSQL ${{ matrix.pg }})
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17'] # 17 = Neon default for new projects
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      # Independent cluster WITHOUT jk_* roles for the provider-parity test (Neon-like non-superuser owner).
      postgres_fresh:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # package.json declares pnpm; this job needs no install, so skip the automatic pnpm cache
          package-manager-cache: false
      - name: PostgreSQL ${{ matrix.pg }} client
        run: bash scripts/ci/install-pg-client.sh ${{ matrix.pg }}
      - name: Provider parity (non-superuser owner, documented Neon bootstrap)
        env:
          PGPORT: '5433'
        run: bash scripts/ci/db-provider-parity.sh
      - name: Migrations, rollback round-trip, seeds, idempotency, SQL tests
        run: bash db/scripts/test-db.sh
      - name: Generated reference seed is up to date
        run: node db/scripts/gen-reference-seed.mjs --check

  api:
    name: api (typecheck + tests + OpenAPI + bundles)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # apps/api/test/global-setup.ts needs a superuser (builds a template DB per migration hash)
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@jastipkita/api..."
      - run: pnpm --filter @jastipkita/api typecheck
      - run: pnpm --filter @jastipkita/api test
      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @jastipkita/api openapi
          if ! git diff --quiet -- docs/api/openapi.json; then
            git --no-pager diff --stat -- docs/api/openapi.json
            echo "::error file=docs/api/openapi.json::docs/api/openapi.json is stale — run 'pnpm --filter @jastipkita/api openapi' and commit the result"
            exit 1
          fi
      - name: Cloudflare Worker bundle (wrangler dry-run, no credentials)
        run: |
          npx --yes wrangler@4 deploy --config infra/cloudflare/wrangler.toml --env staging --dry-run --outdir "$RUNNER_TEMP/worker"
          size=$(gzip -9 -c "$RUNNER_TEMP/worker/worker.js" | wc -c)
          echo "Worker bundle: $(( size / 1024 )) KiB gzip (Workers Free limit 3 MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 2831155 ]; then echo "::warning::Worker bundle is above 90% of the 3 MiB free-plan limit"; fi
      - name: Container bundle (esbuild, used by apps/api/Dockerfile)
        run: node infra/docker/bundle-api.mjs "$RUNNER_TEMP/node-bundle"

  web:
    name: web (Astro build + tests)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice title=web::apps/web/package.json not found — skipped"; fi
      - if: steps.app.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --filter "@jastipkita/web..."
      - if: steps.app.outputs.present == 'true'
        name: Build
        env:
          PUBLIC_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
        run: pnpm --filter @jastipkita/web build
      - if: steps.app.outputs.present == 'true'
        name: Unit tests
        run: pnpm --filter @jastipkita/web run --if-present test:unit
      - if: steps.app.outputs.present == 'true'
        id: smoke
        run: |
          has=$(node -p "Boolean((require('./apps/web/package.json').scripts||{})['test:smoke'])")
          echo "present=$has" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "(require('./apps/web/package.json').devDependencies||{})['@playwright/test']||''")" >> "$GITHUB_OUTPUT"
      - if: steps.smoke.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.smoke.outputs.playwright }}
      - if: steps.smoke.outputs.present == 'true'
        name: Smoke tests (Playwright)
        run: |
          pnpm --filter @jastipkita/web exec playwright install --with-deps chromium
          pnpm --filter @jastipkita/web run test:smoke
      - if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: warn

  admin:
    name: admin (build + tests)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        run: |
          if [ -f apps/admin/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice title=admin::apps/admin/package.json not found — skipped"; fi
      - if: steps.app.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --filter "@jastipkita/admin..."
      - if: steps.app.outputs.present == 'true'
        run: pnpm --filter @jastipkita/admin run --if-present typecheck
      - if: steps.app.outputs.present == 'true'
        env:
          VITE_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
          VITE_APP_ENV: staging
        run: pnpm --filter @jastipkita/admin build
      - if: steps.app.outputs.present == 'true'
        run: pnpm --filter @jastipkita/admin run --if-present test
      - if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist
          retention-days: 7
          if-no-files-found: warn

  mobile:
    name: mobile (Flutter analyze + test + builds)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: app
        working-directory: .
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice title=mobile::apps/mobile/pubspec.yaml not found — skipped"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.app.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.app.outputs.present == 'true'
        id: scaffold
        name: Generate platform folders when missing (not committed yet)
        run: |
          if [ -d android ]; then echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          had_test=false; [ -f test/widget_test.dart ] && had_test=true
          flutter create --platforms=android,ios,web --org com.antarkitaindonesia --project-name jastipkita .
          # the template test references a counter app that does not exist in this project
          if [ "$had_test" = false ]; then rm -f test/widget_test.dart; fi
          echo "created=true" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        run: flutter pub get
      - if: steps.app.outputs.present == 'true'
        name: Launcher icons & native splash (when configured)
        run: |
          if grep -q '^flutter_launcher_icons:' pubspec.yaml || [ -f flutter_launcher_icons.yaml ]; then dart run flutter_launcher_icons; else echo "launcher icons not configured"; fi
          if grep -q '^flutter_native_splash:' pubspec.yaml || [ -f flutter_native_splash.yaml ]; then dart run flutter_native_splash:create; else echo "native splash not configured"; fi
      - if: steps.app.outputs.present == 'true'
        name: Localizations
        run: |
          if [ -f l10n.yaml ] || grep -qE '^\s+generate:\s*true' pubspec.yaml; then flutter gen-l10n; else echo "l10n not configured"; fi
      - if: steps.app.outputs.present == 'true'
        run: flutter analyze
      - if: steps.app.outputs.present == 'true'
        name: Tests
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then flutter test; else echo "::notice title=mobile::no tests found"; fi
      - if: steps.app.outputs.present == 'true'
        name: Build APK (debug, staging API)
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ env.CI_API_BASE_URL }} --dart-define=APP_ENV=staging
      - if: steps.app.outputs.present == 'true'
        name: Build web (served at /jastipkita/app/)
        run: flutter build web --release --base-href /jastipkita/app/ --dart-define=API_BASE_URL=${{ env.CI_API_BASE_URL }} --dart-define=APP_ENV=staging
      - if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web
          path: apps/mobile/build/web
          retention-days: 7
      - if: steps.scaffold.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-platform-scaffold
          path: |
            apps/mobile/android
            apps/mobile/ios
            apps/mobile/web
            apps/mobile/.metadata
          retention-days: 14

  secrets:
    name: secret scan (guard + gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository guard (.env files, keys, keystores, credential patterns)
        run: bash scripts/ci/secret-grep.sh
      - name: gitleaks (full history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo gitleaks/gitleaks --json tagName -q .tagName)
          case "$tag" in v8.*) ;; *) echo "::error::unexpected gitleaks major version $tag (pinned to v8)"; exit 1 ;; esac
          v="${tag#v}"
          ( cd "$RUNNER_TEMP"
            gh release download "$tag" --repo gitleaks/gitleaks --clobber \
              --pattern "gitleaks_${v}_linux_x64.tar.gz" --pattern "gitleaks_${v}_checksums.txt"
            grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
            tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks )
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  dependency-audit:
    name: dependency audit (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: pnpm audit (production dependencies, high+)
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high | tee "$RUNNER_TEMP/pnpm-audit.txt" || {
            echo "::warning title=pnpm audit::high/critical advisories in production dependencies — see job log"; exit 1; }
      - name: OSV-Scanner (npm + pub lockfiles)
        continue-on-error: true
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          args=(--lockfile=pnpm-lock.yaml)
          [ -f apps/mobile/pubspec.lock ] && args+=(--lockfile=apps/mobile/pubspec.lock)
          "$(go env GOPATH)/bin/osv-scanner" scan source "${args[@]}" || {
            echo "::warning title=OSV-Scanner::known vulnerabilities found — see job log"; exit 1; }
      - name: Semgrep SAST (free CodeQL alternative for a private repo)
        continue-on-error: true
        run: |
          pipx install --quiet semgrep
          semgrep scan --metrics=off --config p/typescript --config p/owasp-top-ten --config p/secrets \
            --exclude '**/*.test.ts' --exclude 'docs/**' --exclude 'brand/**' --error apps packages scripts || {
            echo "::warning title=Semgrep::findings — see job log"; exit 1; }
